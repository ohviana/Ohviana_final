    <clipPath id="land"><path d="M347.4 175.7 Q364 146 377.0 177.4 L474.5 412.3 Q486 440 456.0 440.0 L210.0 440.0 Q200 440 204.9 431.3 Z"/><path d="M177.9 108.3 Q196 66 218.0 106.4 L385.6 413.7 Q400 440 370.0 440.0 L70.0 440.0 Q36 440 49.4 408.7 Z"/></clipPath>
